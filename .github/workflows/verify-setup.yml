# Generated by android-repo-setup bootstrap.
name: Verify setup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify bootstrap, workflows, publishing and evaluated modules
        if: runner.os == 'Linux'
        run: |
          sh ./setup.sh setup check
          sh ./docs.sh check
      - name: Smoke test Windows launcher and verify bootstrap
        if: runner.os == 'Windows'
        shell: cmd
        run: setup.bat bootstrap check
      - name: Verify standalone Windows documentation launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: docs.bat bootstrap check
