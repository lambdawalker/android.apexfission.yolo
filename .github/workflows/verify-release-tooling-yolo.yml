name: Verify release tooling
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        destination: [maven-central, jitpack]
    env:
      RELEASE_REPOSITORY: ${{ matrix.destination }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust tooling
        env:
          TOOLING_REF: '1da53392b262c7c3129d2bd645dfd7b34ead81e1'
        run: |
          if [[ "$TOOLING_REF" == v* ]]; then ref=(--tag "$TOOLING_REF"); else ref=(--rev "$TOOLING_REF"); fi
          cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git "${ref[@]}" android-repo-setup
      - run: android-repo-setup publishing_config check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare immutable release assets
        run: android-repo-setup assets prepare --module yolo --source "$(git rev-parse HEAD)"
      - name: Verify the local release artifact
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_REPOSITORY" == jitpack ]]; then
            flags+=(-PjitpackBuild=true -PjitpackScopedTag=true)
          fi
          ./gradlew verifyImportDocs :yolo:lintRelease :yolo:publishAllPublicationsToVerificationRepository \
            -PreleaseModule=yolo -PreleaseVersion=9.8.7 "${flags[@]}" --no-daemon
          android-repo-setup module_release check-local --module yolo --version 9.8.7 --source "$(git rev-parse HEAD)"
