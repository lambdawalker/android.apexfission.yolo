# Standalone docs bootstrap and read-only validation.
name: Verify documentation tooling
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify POSIX launcher and documentation
        if: runner.os == 'Linux'
        run: |
          sh ./docs.sh bootstrap check
          sh ./docs.sh check
      - name: Verify Windows launcher and documentation
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call docs.bat bootstrap check
          if errorlevel 1 exit /b %errorlevel%
          call docs.bat check
          if errorlevel 1 exit /b %errorlevel%
